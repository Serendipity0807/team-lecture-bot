server:
  port: 8082

spring:
  application:
    name: genai-backend-service
  datasource:
    url: jdbc:postgresql://localhost:5432/lecturebot_db
    username: lecturebot_user
    password: mysecretpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

genai:
  service:
    url: http://localhost:8000

logging:
  level:
    com.lecturebot: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
