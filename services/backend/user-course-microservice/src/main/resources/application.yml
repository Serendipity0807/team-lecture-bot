server:
  port: 8081

spring:
  application:
    name: user-course-service

  datasource:
    url: jdbc:postgresql://localhost:5432/lecturebot_db
    username: lecturebot_user
    password: mysecretpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-in-ms: 86400000

logging:
  level:
    com.lecturebot: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
