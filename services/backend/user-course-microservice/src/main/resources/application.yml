server:
  port: 8081

spring:
  application:
    name: user-course-service

  datasource:
    url: jdbc:postgresql://localhost:5432/lecturebot_db
    username: lecturebot_user
    password: mysecretpassword
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  jwt:
    # 开发环境默认值(≥32 字节,满足 HS256 要求);生产请用环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:dev-only-jwt-secret-key-change-me-in-production-0123456789}
    expiration-in-ms: 86400000

logging:
  level:
    com.lecturebot: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
